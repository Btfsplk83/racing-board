# Each run polls every 5 minutes for about 5 h 40 min. The hourly schedule keeps
# one run queued behind the running one, so polling continues even when GitHub
# skips scheduled starts. Extra queued runs show as "cancelled"; that is expected.
name: Poll dailies

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Poll loop
        run: |
          git config user.name "dailies-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash poller/loop.sh
